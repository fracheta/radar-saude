<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Radar Saúde | Escolha seu perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0c4a6e; /* fallback */
      background-image: url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      position: relative;
      padding: 1.2rem;
      margin: 0;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(2, 24, 54, 0.78) 0%, rgba(3, 64, 120, 0.65) 60%, rgba(2, 50, 90, 0.7) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 0;
    }

    .particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      animation: float 18s infinite ease-in-out;
    }
    .particle:nth-child(1) { width: 200px; height: 200px; top: -40px; left: -40px; }
    .particle:nth-child(2) { width: 140px; height: 140px; bottom: 10%; right: -30px; animation-delay: -6s; }
    .particle:nth-child(3) { width: 100px; height: 100px; top: 40%; left: 5%; animation-delay: -11s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -25px) scale(1.05); }
      50% { transform: translate(-15px, 20px) scale(0.95); }
      75% { transform: translate(20px, 10px) scale(1.02); }
    }

    .profile-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 3.2rem;
      padding: 2.8rem 2.2rem 2.4rem;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      text-align: center;
      animation: cardRise 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    @keyframes cardRise {
      0% { opacity: 0; transform: translateY(45px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.8rem;
      border-radius: 30px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 28px rgba(30, 64, 175, 0.25), 0 0 0 4px rgba(59, 130, 246, 0.2);
      overflow: hidden;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    .brand-accent {
      color: #1d4ed8;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #334155;
      margin-bottom: 2.2rem;
      font-weight: 450;
      line-height: 1.5;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-bottom: 1.8rem;
    }

    .btn-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1.1rem 1.5rem;
      border-radius: 2.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 80%);
      box-shadow: 0 10px 25px rgba(30, 64, 175, 0.4);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      border: none;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }
    .btn-profile::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.25) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      transform: rotate(25deg);
    }
    .btn-profile:hover {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      transform: translateY(-3px);
      box-shadow: 0 18px 35px rgba(37, 99, 235, 0.5);
    }
    .btn-profile:hover::after {
      opacity: 1;
    }
    .btn-profile:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(30,64,175,0.4);
    }
    .btn-profile:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }

    .btn-user {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 80%);
    }
    .btn-employee {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 80%);
      box-shadow: 0 10px 25px rgba(15, 118, 110, 0.4);
    }
    .btn-employee:hover {
      background: linear-gradient(135deg, #115e59, #14b8a6);
      box-shadow: 0 18px 35px rgba(20, 184, 166, 0.5);
    }

    .icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .note {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.5rem;
    }

    @media (max-width: 380px) {
      .profile-card {
        padding: 2.2rem 1.5rem;
      }
      h1 {
        font-size: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .profile-card,
      .particle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="particles" aria-hidden="true">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <main class="profile-card">
    <!-- Logo (substituir "1.img" pelo caminho da sua logo) -->
    <div class="logo-wrapper">
      <img src="1.img" alt="Logo Radar Saúde" class="logo-img">
    </div>

    <h1>Radar <span class="brand-accent">Saúde</span></h1>
    <p class="subtitle">
      Selecione o seu perfil para acessar<br>a plataforma adequada.
    </p>

    <div class="buttons-container">
      <!-- Botão Usuário -->
      <a href="https://link-de-download-usuario.com/app" class="btn-profile btn-user" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Sou Usuário
      </a>

      <!-- Botão Funcionário -->
      <a href="https://link-de-download-funcionario.com/painel" class="btn-profile btn-employee" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Sou Funcionário
      </a>
    </div>

    <p class="note">
      Você será redirecionado para a loja de aplicativos ou portal de download.
    </p>
  </main>

  <!-- Script opcional para substituir links facilmente -->
  <script>
    // Você pode alterar os links diretamente nos atributos href acima
    // ou definir aqui para facilitar a manutenção.
    // Exemplo:
    // document.querySelector('.btn-user').href = 'https://seusite.com/download-usuario';
    // document.querySelector('.btn-employee').href = 'https://seusite.com/download-funcionario';
  </script>
</body>
</html>
